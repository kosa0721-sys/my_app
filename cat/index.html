<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://kosa0721-sys.github.io/cat_app/">

<title>猫の気持ち（移転しました）</title>
<style>body{background:#f7efe4;color:#4a3428;font-family:sans-serif;text-align:center;padding:40px 16px}a{color:#c0607a}</style>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.indexOf('/my_app/cat/') !== -1) r.unregister(); })).catch(() => {});
}
if (window.caches) caches.keys().then(ks => ks.filter(k => k.indexOf('cat-mood-') === 0).forEach(k => caches.delete(k))).catch(() => {});
location.replace('https://kosa0721-sys.github.io/cat_app/');
</script>
</head>
<body>
<p>🐾 猫の気持ちアプリは新しい場所に移りました。</p>
<p><a href="https://kosa0721-sys.github.io/cat_app/">https://kosa0721-sys.github.io/cat_app/</a></p>
</body>
</html>
